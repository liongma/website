<div id="walking-cat" class="walking-cat" style="display: none;"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const cat = document.getElementById("walking-cat");
  let x, y, dx, dy;
  let entered = false;

const speed = 0.6; 

function startCat() {
  const maxX = window.innerWidth - 64;
  const maxY = window.innerHeight - 64;
  const edge = Math.floor(Math.random() * 4);

  if (edge === 0) {
    x = Math.random() * maxX; y = -64;
    dx = (Math.random() - 0.5) * speed; dy = speed;
  } else if (edge === 1) {
    x = window.innerWidth; y = Math.random() * maxY;
    dx = -speed; dy = (Math.random() - 0.5) * speed;
  } else if (edge === 2) {
    x = Math.random() * maxX; y = window.innerHeight;
    dx = (Math.random() - 0.5) * speed; dy = -speed;
  } else {
    x = -64; y = Math.random() * maxY;
    dx = speed; dy = (Math.random() - 0.5) * speed;
  }

    cat.style.display = "block";
    cat.style.left = x + "px";
    cat.style.top = y + "px";
    cat.style.transform = dx < 0 ? "scaleX(-1)" : "scaleX(1)";

    requestAnimationFrame(enterLoop);
  }

  function enterLoop() {
    const maxX = window.innerWidth - 64;
    const maxY = window.innerHeight - 64;

    x += dx;
    y += dy;
    cat.style.left = x + "px";
    cat.style.top = y + "px";

    
    if (x >= 0 && x <= maxX && y >= 0 && y <= maxY) {
      entered = true;
      requestAnimationFrame(moveCat);
    } else {
      requestAnimationFrame(enterLoop);
    }
  }

  function moveCat() {
    const maxX = window.innerWidth - 64;
    const maxY = window.innerHeight - 64;

    x += dx;
    y += dy;

    if (x >= maxX || x <= 0) {
      dx *= -1;
      cat.style.transform = dx > 0 ? "scaleX(1)" : "scaleX(-1)";
    }
    if (y >= maxY || y <= 0) {
      dy *= -1;
    }

    cat.style.left = x + "px";
    cat.style.top = y + "px";

    requestAnimationFrame(moveCat);
  }

  setTimeout(startCat, 5000);
});
</script>

<script>

        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
